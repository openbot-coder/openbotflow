[project]
name = "botflow"
version = "3.1.0"
description = "AI middleware platform - LLM Proxy, LLM-Wiki, IM Bridge"
readme = "README.md"
authors = [
    { name = "vex1023", email = "vex1023@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "aiosqlite>=0.20.0",
    "openai>=1.82.0",
    "anthropic>=0.52.0",
    "google-genai>=1.21.0",
    # LLM 工作流升级（P6 LangGraphStrategy）：按决策走 hard 依赖，
    # 使 langgraph 策略始终可用，不再"未安装则静默跳过"。
    "langgraph>=0.2.0",
    # P9-6：用真正的 BPE 分词器替换 _cjk_ratio 启发式估算 token。
    # 同 P6 的 langgraph：若降级回旧启发式 = 精度无声退化，不可接受，故走硬依赖
    # （不再"未安装则静默跳过"）。o200k_base 是 DeepSeek 未公开词表的实测最小误差代理。
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
deepseek = ["deepseek>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
botflow = "botflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]
addopts = ["-m", "not integration"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["botflow"]

[tool.coverage.report]
show_missing = true
# Lines containing the marker below are excluded from coverage because they
# exercise runtime/service/network behaviour that cannot be unit-tested.
exclude_lines = [
    "pragma: no cover",
    "UNCOVERED",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __repr__",
    "def __str__",
]
