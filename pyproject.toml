[project]
name = "botflow"
version = "V0.2.1"
description = "AI middleware platform - LLM Proxy, LLM-Wiki, IM Bridge"
readme = "README.md"
authors = [
    { name = "vex1023", email = "vex1023@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "aiosqlite>=0.20.0",
    "openai>=1.82.0",
    "anthropic>=0.52.0",
    "google-genai>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
]
deepseek = ["deepseek>=1.0.0"]

[project.scripts]
botflow = "botflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]
addopts = ["-m", "not integration"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["botflow"]

[tool.coverage.report]
show_missing = true
# Lines containing the marker below are excluded from coverage because they
# exercise runtime/service/network behaviour that cannot be unit-tested.
exclude_lines = [
    "pragma: no cover",
    "UNCOVERED",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __repr__",
    "def __str__",
]
