[project]
name = "botflow"
version = "V0.2.1"
description = "AI middleware platform - LLM Proxy, LLM-Wiki, IM Bridge"
readme = "README.md"
authors = [
    { name = "vex1023", email = "vex1023@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "loguru>=0.7.0",
    "aiosqlite>=0.20.0",
    "openai>=1.82.0",
    "anthropic>=0.52.0",
    "google-genai>=1.21.0",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "markitdown>=0.1.0",
    "ripgrep>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
botflow = "botflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]
addopts = ["-m", "not integration"]
asyncio_mode = "auto"
