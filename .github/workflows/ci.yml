name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # testpaths=["tests"] and -m "not integration" come from pyproject.toml
      - name: Run tests
        run: |
          uv run pytest tests/ \
            --tb=short \
            --cov=botflow \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          retention-days: 1

  # 仅提示，不阻塞合并。
  # 当前基线：ruff check 477 错误、ruff format 70/98 文件待重排、mypy 32 错误。
  # 逐个清零后再把继续失败关掉（去掉 continue-on-error）。
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: ruff check
        continue-on-error: true
        run: uv run ruff check .

      - name: ruff format check
        continue-on-error: true
        run: uv run ruff format --check .

      - name: mypy
        continue-on-error: true
        run: uv run mypy src/botflow
